<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'SF Mono','Cascadia Mono',monospace">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221635"/>
      <stop offset="1" stop-color="#3C2440"/>
    </linearGradient>
    <linearGradient id="before" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E4458"/>
      <stop offset=".62" stop-color="#7A6E72"/>
      <stop offset="1" stop-color="#9A9088"/>
    </linearGradient>
    <linearGradient id="after" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B1B45"/>
      <stop offset=".58" stop-color="#C8502F"/>
      <stop offset="1" stop-color="#F0B47A"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#gbg)"/>

  <!-- tablet -->
  <rect x="170" y="96" width="1260" height="708" rx="40" fill="#0E0818"/>
  <rect x="170" y="96" width="1260" height="708" rx="40" fill="none" stroke="#4A3A5C" stroke-width="3"/>
  <rect x="206" y="132" width="1188" height="636" rx="20" fill="#140D24"/>

  <!-- toolbar -->
  <text x="244" y="186" font-size="20" letter-spacing="3" fill="#F0937A">AI CAMERA COPILOT · GRADE</text>
  <g font-size="19" fill="#F5EFE4" opacity=".75" text-anchor="end">
    <text x="1356" y="186">export ↗</text>
  </g>

  <!-- split image area -->
  <g>
    <clipPath id="imgL"><rect x="244" y="216" width="556" height="420" rx="14"/></clipPath>
    <clipPath id="imgR"><rect x="800" y="216" width="556" height="420" rx="14"/></clipPath>
    <!-- before -->
    <g clip-path="url(#imgL)">
      <rect x="244" y="216" width="556" height="420" fill="url(#before)"/>
      <circle cx="660" cy="500" r="34" fill="#C9C2B2"/>
      <g fill="#2E3142" opacity=".85">
        <rect x="280" y="496" width="26" height="140"/>
        <rect x="316" y="468" width="18" height="168"/>
        <rect x="340" y="510" width="32" height="126"/>
        <polygon points="392,636 392,486 406,448 420,486 420,636"/>
        <rect x="432" y="520" width="26" height="116"/>
        <rect x="468" y="544" width="20" height="92"/>
      </g>
      <rect x="244" y="560" width="556" height="76" fill="#23263A" opacity=".7"/>
    </g>
    <!-- after -->
    <g clip-path="url(#imgR)">
      <rect x="800" y="216" width="556" height="420" fill="url(#after)"/>
      <circle cx="1216" cy="500" r="38" fill="#FFE0A8"/>
      <g fill="#1A112E" opacity=".92">
        <rect x="836" y="496" width="26" height="140"/>
        <rect x="872" y="468" width="18" height="168"/>
        <rect x="896" y="510" width="32" height="126"/>
        <polygon points="948,636 948,486 962,448 976,486 976,636"/>
        <rect x="988" y="520" width="26" height="116"/>
        <rect x="1024" y="544" width="20" height="92"/>
      </g>
      <rect x="800" y="560" width="556" height="76" fill="#2B1535" opacity=".7"/>
      <rect x="1140" y="540" width="44" height="96" fill="#F0937A" opacity=".25"/>
    </g>
    <!-- labels -->
    <rect x="262" y="234" width="116" height="40" rx="20" fill="#0E0818" opacity=".75"/>
    <text x="320" y="261" font-size="19" fill="#F5EFE4" text-anchor="middle">before</text>
    <rect x="1222" y="234" width="116" height="40" rx="20" fill="#0E0818" opacity=".75"/>
    <text x="1280" y="261" font-size="19" fill="#F0937A" text-anchor="middle">after</text>
    <!-- split handle -->
    <line x1="800" y1="216" x2="800" y2="636" stroke="#F5EFE4" stroke-width="3"/>
    <circle cx="800" cy="426" r="26" fill="#F5EFE4"/>
    <g stroke="#1A112E" stroke-width="3" fill="none">
      <path d="M790 416 l-8 10 8 10"/>
      <path d="M810 416 l8 10 -8 10"/>
    </g>
    <!-- score -->
    <rect x="1238" y="580" width="100" height="40" rx="20" fill="#0E0818" opacity=".8"/>
    <text x="1288" y="607" font-size="20" fill="#F0937A" text-anchor="middle">96 ✦</text>
  </g>

  <!-- recipe row -->
  <g font-size="19" fill="#F5EFE4">
    <rect x="244" y="668" width="190" height="52" rx="26" fill="none" stroke="#F0937A" stroke-opacity=".8" stroke-width="2"/>
    <text x="270" y="701">warmth&#160;&#160;+12</text>
    <rect x="450" y="668" width="200" height="52" rx="26" fill="none" stroke="#F5EFE4" stroke-opacity=".35" stroke-width="2"/>
    <text x="476" y="701">contrast&#160;&#160;+8</text>
    <rect x="666" y="668" width="230" height="52" rx="26" fill="none" stroke="#F5EFE4" stroke-opacity=".35" stroke-width="2"/>
    <text x="692" y="701">shadows · lifted</text>
    <rect x="912" y="668" width="160" height="52" rx="26" fill="none" stroke="#F5EFE4" stroke-opacity=".35" stroke-width="2"/>
    <text x="938" y="701">grain&#160;&#160;6</text>
    <text x="1356" y="701" text-anchor="end" fill="#F0937A">your recipe — not a preset</text>
  </g>
</svg>
